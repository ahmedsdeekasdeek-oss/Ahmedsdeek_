<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E7EEF6;
    --card:#FBFDFF;
    --card-hover:#FFFFFF;
    --text:#173A5E;
    --muted:#7893AC;
    --navy:#2F5D8A;
    --navy-deep:#183654;
    --navy-light:#8FB4DC;
    --line:#D6E2EF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(47,93,138,0.09), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(143,180,220,0.20), transparent 50%),
      linear-gradient(180deg, rgba(47,93,138,0.05) 0%, transparent 30%);
    pointer-events:none;
  }
  .card{
    width:100%;
    max-width:440px;
    position:relative;
    z-index:1;
  }
  .avatar-ring{
    width:96px;
    height:96px;
    border-radius:50%;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--navy), var(--navy-light));
    padding:3px;
  }
  .avatar-ring img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center 30%;
    display:block;
    border:2px solid var(--card);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    text-align:center;
    letter-spacing:0.2px;
    margin-bottom:6px;
    color:var(--navy-deep);
  }
  .handle{
    font-family:'IBM Plex Mono', monospace;
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-bottom:6px;
    direction:ltr;
  }
  .handle .cursor{
    display:inline-block;
    color:var(--navy);
    animation:blink 1.1s step-end infinite;
    font-weight:600;
  }
  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }
  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    margin-bottom:34px;
    line-height:1.7;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .link-row:hover{
    background:var(--card-hover);
    border-color:var(--navy-light);
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(24,54,84,0.10);
  }
  .link-row:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:2px;
  }
  .icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#DCE7F3;
  }
  .icon svg{width:19px;height:19px;}
  .row-text{flex:1;min-width:0;}
  .platform{
    font-size:14px;
    font-weight:600;
    margin-bottom:2px;
  }
  .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    direction:ltr;
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .arrow{
    color:var(--muted);
    flex:0 0 auto;
    font-size:16px;
  }
  footer{
    text-align:center;
    color:#A9BFD6;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    margin-top:30px;
    letter-spacing:0.5px;
  }
  @media (prefers-reduced-motion: reduce){
    .handle .cursor{animation:none; opacity:1;}
  }
</style>
</head>
